<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Download & History">
    <meta name="color-scheme" content="dark">
    <title>Ryan100C's Mods</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./app.js" type="module"></script>
  </head>
  <body>
    <header class="site-header">
      <a id="site-name" class="brand" href="./">Ryan100C's Mods</a>
      <span class="brand__mark" aria-hidden="true">✦</span>
    </header>

    <main class="home">
      <section class="home-intro">
        <p class="eyebrow">MOD COLLECTION</p>
        <h1 id="page-title">Collection</h1>
        <p id="site-description">All my mods</p>
      </section>

      <section class="toolbar" aria-label="Filter mods">
        <label class="sr-only" for="search">Search for mods</label>
        <input id="search" type="search" placeholder="Search by name, version, loader…" autocomplete="off">
        <span id="project-count" aria-live="polite"></span>
      </section>

      <section id="projects" class="mod-grid" aria-live="polite">
        <p class="loading">Loading mods…</p>
      </section>
    </main>

  </body>
</html>
