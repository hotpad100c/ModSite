<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="模组下载与历史版本">
    <meta name="color-scheme" content="dark">
    <title>我的模组</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <header class="site-header">
      <a id="site-name" class="brand" href="/">我的模组</a>
      <span class="brand__mark" aria-hidden="true">✦</span>
    </header>

    <main class="home">
      <section class="home-intro">
        <p class="eyebrow">MOD COLLECTION</p>
        <h1 id="page-title">模组收藏</h1>
        <p id="site-description">我制作和维护的模组。</p>
      </section>

      <section class="toolbar" aria-label="筛选模组">
        <label class="sr-only" for="search">搜索模组</label>
        <input id="search" type="search" placeholder="输入名称、版本或加载器…" autocomplete="off">
        <span id="project-count" aria-live="polite"></span>
      </section>

      <section id="projects" class="mod-grid" aria-live="polite">
        <p class="loading">正在读取模组清单…</p>
      </section>
    </main>

    <footer class="site-footer">所有文件均提供 SHA-256 校验值。</footer>
  </body>
</html>
